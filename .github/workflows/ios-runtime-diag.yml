name: iOS runtime diagnostic

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - run: |
          set -x
          xcodebuild -version
          echo "=== installed runtimes ==="
          xcrun simctl runtime list
          echo "=== available devices ==="
          xcrun simctl list devices available | head -20
          echo "=== try download iOS 18.6 runtime ==="
          ( xcodebuild -downloadPlatform iOS -buildVersion 18.6.2 2>&1 | tail -5 ) || true
          echo "=== retry: xcodebuild -downloadPlatform iOS ==="
          xcrun simctl runtime list | grep -i ios || true
