# Builds LCProxyTweak (LiveContainer proxy tweak: 王卡免流 + Tailscale core
# 生命周期) inside this public repo, because GitHub Free private repos cannot
# use macOS runners. The dylib + console app land in the same Release as
# libTailscaleCore.
#
# Source: cmd/lcproxytweak (mirror of koast18/lcproxy-tweak).
# LiveContainer signs both products locally (ZSign) on import; we ship them
# unsigned on purpose.
name: LCProxyTweak dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/lcproxytweak/**'

permissions:
  contents: write

jobs:
  lcproxy:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate embedded console HTML header
        run: |
          cd cmd/lcproxytweak
          node Scripts/gen_console_asset.js Resources/console.html Sources/KPWebServer/ConsoleHTML.h

      - name: Build tweak dylib
        run: |
          cd cmd/lcproxytweak
          bash Scripts/build_ios.sh

      - name: Verify dylib
        run: |
          file cmd/lcproxytweak/build/LCProxyTweak.dylib
          nm -gU cmd/lcproxytweak/build/LCProxyTweak.dylib | awk '{print $NF}' | sed 's/^_//' | grep -E '^(LCProxyTweakConstructor|KPTsCore|KPWebServer|KPModeController|KPKingForwarder|kp_)' | sort -u | head -12

      - name: Build console app (.ipa)
        run: |
          cd cmd/lcproxytweak
          bash Scripts/build_console.sh

      - name: Versionize artifacts (tag-based filenames)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd cmd/lcproxytweak/build
          # 版本号：取最新 release tag（v0.1.0 …），缺省用日期
          TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ]; then TAG="v$(date +%Y%m%d-%H%M%S)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp LCProxyTweak.dylib "LCProxyTweak-${TAG}.dylib"
          cp LCProxyConsole.ipa "LCProxyConsole-${TAG}.ipa"
          # 下载当前 release 的 core（不带版本号资产名）→ 版本化
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'libTailscaleCore.dylib' --dir . 2>/dev/null \
            && cp libTailscaleCore.dylib "libTailscaleCore-${TAG}.dylib" \
            || echo "no core asset on release; skipping core versionize"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LCProxyTweak-ios
          path: |
            cmd/lcproxytweak/build/LCProxyTweak-*.dylib
            cmd/lcproxytweak/build/LCProxyConsole-*.ipa
            cmd/lcproxytweak/build/libTailscaleCore-*.dylib
          if-no-files-found: error

      - name: Publish AltStore-style source (fixed URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE"
          TAG="${{ env.TAG }}"
          VERSION="$(grep -o '0\.[0-9]\+\.[0-9]\+' cmd/lcproxytweak/Sources/LCProxyTweak.m | head -1)"
          SIZE="$(stat -f%z cmd/lcproxytweak/build/LCProxyConsole-${TAG}.ipa)"
          NOW="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          IPA_URL="https://gh-proxy.com/https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/LCProxyConsole-${TAG}.ipa"
          ICON_URL="https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/altstore/icon.png"
          mkdir -p altstore
          python3 - "$TAG" "$VERSION" "$SIZE" "$NOW" "$IPA_URL" "$ICON_URL" > altstore/altstore-source.json <<'EOF'
          import json, sys
          tag, ver, size, now, ipa, icon = sys.argv[1:]
          src = {
              "name": "LCProxy 源",
              "identifier": "com.lcproxy.source",
              "sourceURL": "https://gh-proxy.com/https://raw.githubusercontent.com/koast18/tailscale/main/altstore/altstore-source.json",
              "apps": [{
                  "name": "LCProxy 控制台",
                  "bundleIdentifier": "com.lcproxy.console",
                  "developerName": "koast18",
                  "version": ver,
                  "versionDate": now,
                  "versionDescription": "LCProxy 控制台（Tailscale + 免流代理）。打开自动下载两个 dylib。",
                  "downloadURL": ipa,
                  "localizedDescription": "LiveContainer 内免流 + Tailscale 出口代理控制台。首次打开自动下载 core 与 tweak（带版本号文件名），LiveContainer 自动签名后重启生效。",
                  "iconURL": icon,
                  "tintColor": "2E7D32",
                  "size": int(size),
                  "versions": [{"version": ver, "date": now, "downloadURL": ipa,
                                "localizedDescription": "上游代理设置 + 逐行调试日志 + 崩溃修复 + 登录不假完成"}],
              }],
              "news": [],
          }
          json.dump(src, sys.stdout, ensure_ascii=False, indent=2)
          EOF
          # 图标（180x180 纯色 PNG，python zlib 生成，无外部依赖）
          python3 - <<'EOF'
          import struct, zlib
          w = h = 180
          rows = []
          for y in range(h):
              row = b'\x00'
              for x in range(w):
                  if 40 < x < 140 and 40 < y < 140:
                      row += bytes((46, 125, 50, 255))
                  else:
                      row += bytes((20, 24, 30, 255))
              rows.append(row)
          raw = b''.join(rows)
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n'
          png += chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(raw))
          png += chunk(b'IEND', b'')
          open('altstore/icon.png', 'wb').write(png)
          EOF
          git add altstore/altstore-source.json altstore/icon.png
          git -c user.name="ci" -c user.email="ci@local" commit -m "altstore: update source v${VERSION} [skip ci]" || echo "(no change)"
          # 并发 push 竞争：先 rebase 再推
          git pull --rebase origin main 2>/dev/null || true
          git push origin main 2>&1 | tail -2 || echo "push failed (retrying once)"
          sleep 3
          git push origin main 2>&1 | tail -1 || true
          echo "=== published source ==="
          cat altstore/altstore-source.json | head -20

      - name: Attach to Release v0.1.0 (if exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            cd cmd/lcproxytweak/build
            gh release upload v0.1.0 \
              "LCProxyTweak-${TAG}.dylib" \
              "LCProxyConsole-${TAG}.ipa" \
              "libTailscaleCore-${TAG}.dylib" \
              --repo "$GITHUB_REPOSITORY" --clobber \
              || echo "::warning::release attach partially failed (may already exist)"
            echo "uploaded versionized assets to v0.1.0"
          else
            echo "release v0.1.0 not present; artifacts are in the run"
          fi
