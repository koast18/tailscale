# Builds libTailscaleCore.dylib (arm64 + arm64e, iOS 15+), the Tailscale
# core dynamic library for sideloading (LiveContainer-style hosts).
#
# Triggers:
#   - push of a tag: only the LATEST tag that does NOT end with "-pre"
#     actually builds. Pre-releases and older tags are skipped.
#   - workflow_dispatch: manual build (always runs).
name: iOS Tailscale Core dylib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-dylib:
    runs-on: macos-latest
    steps:
      - name: Skip non-latest / pre-release tags
        if: github.event_name == 'push'
        run: |
          CURRENT="$GITHUB_REF_NAME"
          # List all tags on the remote, drop peeled ^{} entries, drop any
          # tag ending in "-pre", then take the highest semantic version.
          LATEST="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk -F/ '{print $NF}' \
            | grep -v '\^{}' \
            | grep -v -- '-pre$' \
            | sort -V \
            | tail -n1)"
          echo "CURRENT_TAG=$CURRENT"
          echo "LATEST_NON_PRE_TAG=$LATEST"
          if [ -z "$LATEST" ] || [ "$CURRENT" != "$LATEST" ]; then
            echo "::notice::Tag $CURRENT is not the latest non-pre tag ($LATEST); skipping build."
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP_BUILD != '1'
        uses: actions/checkout@v4

      - name: Set up Go
        if: env.SKIP_BUILD != '1'
        uses: actions/setup-go@v5
        with:
          # tailscale's go.mod pins go 1.26.6; setup-go aligns and Go itself
          # auto-downloads the toolchain if needed.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build arm64
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0"
          # Go does NOT support -buildmode=c-shared on ios/arm64 (hardcoded in
          # internal/platform); iOS only supports c-archive. The archive carries
          # a __mod_init_func constructor that initializes the Go runtime at
          # dyld load time, so we compile a static archive and then link it
          # into a dylib below.
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-archive -trimpath -ldflags "-s -w" \
            -o dist/libTailscaleCore-arm64.a ./cmd/tscore

      - name: Link arm64 dylib from archive
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -dynamiclib \
            -arch arm64 -isysroot "${SDK}" -mios-version-min=15.0 \
            -Wl,-all_load -Wl,-ObjC \
            dist/libTailscaleCore-arm64.a \
            -framework Foundation \
            -framework Security \
            -framework CoreFoundation \
            -o dist/libTailscaleCore-arm64.dylib

      - name: Build arm64e
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64e -isysroot ${SDK} -mios-version-min=15.0"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64e \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64e -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64e -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-archive -trimpath -ldflags "-s -w" \
            -o dist/libTailscaleCore-arm64e.a ./cmd/tscore

      - name: Link arm64e dylib from archive
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -dynamiclib \
            -arch arm64e -isysroot "${SDK}" -mios-version-min=15.0 \
            -Wl,-all_load -Wl,-ObjC \
            dist/libTailscaleCore-arm64e.a \
            -framework Foundation \
            -framework Security \
            -framework CoreFoundation \
            -o dist/libTailscaleCore-arm64e.dylib

      - name: Merge universal dylib (lipo)
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          lipo -create \
            dist/libTailscaleCore-arm64.dylib \
            dist/libTailscaleCore-arm64e.dylib \
            -output dist/libTailscaleCore.dylib
          # The header generated by either c-archive build is identical; keep
          # the arm64 one as the shipped header.
          cp dist/libTailscaleCore-arm64.h dist/libTailscaleCore.h
          rm -f dist/libTailscaleCore-arm64.dylib dist/libTailscaleCore-arm64e.dylib
          rm -f dist/libTailscaleCore-arm64.a dist/libTailscaleCore-arm64e.a

      - name: Verify Mach-O format
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          file dist/libTailscaleCore.dylib
          lipo -info dist/libTailscaleCore.dylib
          echo "--- otool -L ---"
          otool -L dist/libTailscaleCore.dylib

      - name: Verify exported symbols
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          cat > /tmp/expected.txt <<'EOF'
          TsClearExitNode
          TsDebugDERPRegion
          TsDeleteWaitingFile
          TsFileTargets
          TsFreeString
          TsGetExitNodeStatus
          TsGetPrefsJSON
          TsGetWaitingFile
          TsInit
          TsIsRunning
          TsListExitNodes
          TsListPeers
          TsLogin
          TsLoginURL
          TsNeedsLogin
          TsNetcheck
          TsPing
          TsPushFile
          TsSetExitNode
          TsSetExitNodeAllowLANAccess
          TsSetHostname
          TsSetHttpProxy
          TsSetLogCallback
          TsSetPrefsJSON
          TsSetRouteAll
          TsSetStateCallback
          TsSocks5Addr
          TsSocks5Cred
          TsStart
          TsStartLocalHTTPProxy
          TsStatusDetailJSON
          TsStop
          TsStopLocalHTTPProxy
          TsSuggestExitNode
          TsTailscaleIPs
          TsWaitingFiles
          TsWhoIs
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          nm -gU dist/libTailscaleCore.dylib \
            | sed 's/^_//' \
            | grep -E '^Ts[A-Z]' \
            | cut -d' ' -f1 \
            | sort -u > /tmp/actual.txt
          echo "--- missing symbols (must be empty) ---"
          comm -23 /tmp/expected.txt /tmp/actual.txt
          echo "--- extra Ts* symbols ---"
          comm -13 /tmp/expected.txt /tmp/actual.txt
          MISSING="$(comm -23 /tmp/expected.txt /tmp/actual.txt)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing exported symbols: $MISSING"
            exit 1
          fi
          echo "::notice::All $(wc -l < /tmp/expected.txt) expected Ts* symbols exported."

      - name: Check no undefined symbols
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          UNDEF="$(nm -u dist/libTailscaleCore.dylib)"
          echo "Undefined symbols (allowed: dyld stubs only):"
          echo "$UNDEF"

      - name: Upload artifact
        if: env.SKIP_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: libTailscaleCore-ios
          path: |
            dist/libTailscaleCore.dylib
            dist/libTailscaleCore.h
          if-no-files-found: error
