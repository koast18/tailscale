# Builds libTailscaleCore.dylib (arm64 + arm64e, iOS 15+), the Tailscale
# core dynamic library for sideloading (LiveContainer-style hosts).
#
# Triggers:
#   - push of a tag: only the LATEST tag that does NOT end with "-pre"
#     actually builds. Pre-releases and older tags are skipped.
#   - workflow_dispatch: manual build (always runs).
name: iOS Tailscale Core dylib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # Reusable: sync-upstream-release.yml calls this with release_tag set.
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: false
        description: >-
          Release version tag. When set (workflow_call from the upstream
          sync), the GitHub Release is named after it. Otherwise the push tag
          is used; workflow_dispatch falls back to manual-<timestamp>.

permissions:
  contents: write

jobs:
  build-ios-dylib:
    runs-on: macos-latest
    steps:
      - name: Skip non-latest / pre-release tags
        if: github.event_name == 'push'
        run: |
          CURRENT="$GITHUB_REF_NAME"
          # List all tags on the remote, drop peeled ^{} entries, drop any
          # tag ending in "-pre", then take the highest semantic version.
          LATEST="$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" \
            | awk -F/ '{print $NF}' \
            | grep -v '\^{}' \
            | grep -v -- '-pre$' \
            | sort -V \
            | tail -n1)"
          echo "CURRENT_TAG=$CURRENT"
          echo "LATEST_NON_PRE_TAG=$LATEST"
          if [ -z "$LATEST" ] || [ "$CURRENT" != "$LATEST" ]; then
            echo "::notice::Tag $CURRENT is not the latest non-pre tag ($LATEST); skipping build."
            echo "SKIP_BUILD=1" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP_BUILD != '1'
        uses: actions/checkout@v4

      - name: Apply upstream patches
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          for p in cmd/tscore/patches/*.patch; do
            echo "Applying $p"
            git apply "$p"
          done
        # Patches touch tailscale upstream sources (e.g. magicsock
        # debugknobs) without committing modifications; they are applied
        # here so the Go build below uses the patched tree.

      - name: Set up Go
        if: env.SKIP_BUILD != '1'
        uses: actions/setup-go@v5
        with:
          # tailscale's go.mod pins go 1.26.6; setup-go aligns and Go itself
          # auto-downloads the toolchain if needed.
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet (patched tree)
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          go vet ./cmd/tscore ./wgengine/magicsock
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go vet ./cmd/tscore

      - name: Build arm64
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          mkdir -p dist
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0"
          # Go does NOT support -buildmode=c-shared on ios/arm64 (hardcoded in
          # internal/platform); iOS only supports c-archive. The archive carries
          # a __mod_init_func constructor that initializes the Go runtime at
          # dyld load time, so we compile a static archive and then link it
          # into a dylib below.
          #
          # arm64e: the official Go toolchain (incl. 1.26.x) has no ios/arm64e
          # target at all, so the deliverable is a single arm64 slice.
          # arm64e devices (A12+) run arm64 binaries natively via dyld's
          # compatible-slice execution.
          # Version stamping: TsVersion() reports the upstream VERSION.txt
          # (as of the checked-out commit) plus the commit hash, e.g.
          # 1.103.0-gcae406380. VERSION.txt is the pristine upstream file;
          # the patch only touches wgengine/magicsock debugknobs.
          VERSION="$(tr -d '[:space:]' < VERSION.txt 2>/dev/null || true)"
          [ -n "$VERSION" ] || VERSION="dev"
          HASH="$(git rev-parse --short HEAD)"
          VERSION_FLAGS="-s -w -X main.coreVersion=${VERSION}-g${HASH}"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-archive -trimpath -ldflags "${VERSION_FLAGS}" \
            -o dist/libTailscaleCore-arm64.a ./cmd/tscore

      - name: Link arm64 dylib from archive
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -dynamiclib \
            -arch arm64 -isysroot "${SDK}" -mios-version-min=15.0 \
            -Wl,-all_load -Wl,-ObjC \
            dist/libTailscaleCore-arm64.a \
            -framework Foundation \
            -framework Security \
            -framework CoreFoundation \
            -o dist/libTailscaleCore.dylib

      - name: Finalize dylib + header
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          file dist/libTailscaleCore.dylib
          cp dist/libTailscaleCore-arm64.h dist/libTailscaleCore.h
          rm -f dist/libTailscaleCore-arm64.a dist/libTailscaleCore-arm64.h

      - name: Ad-hoc code sign (required for iOS dlopen)
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          # iOS dyld refuses to dlopen an unsigned Mach-O. The clang -dynamiclib
          # link does not add LC_CODE_SIGNATURE, so sign ad-hoc here. The final
          # on-device signing (e.g. LiveContainer's ZSign with a local p12)
          # replaces this on top.
          codesign -s - --force dist/libTailscaleCore.dylib
          echo "--- codesign verification ---"
          codesign -dv --verbose=2 dist/libTailscaleCore.dylib 2>&1 || true
          echo "--- LC_CODE_SIGNATURE ---"
          otool -l dist/libTailscaleCore.dylib | grep -A4 LC_CODE_SIGNATURE || { echo "::error::no LC_CODE_SIGNATURE after codesign"; exit 1; }

      - name: Final sign with app p12 (optional, required for iOS dlopen)
        if: env.SKIP_BUILD != '1' && env.SIGN_P12_B64 != ''
        env:
          SIGN_P12_B64: ${{ secrets.TSCORE_P12_B64 }}
          SIGN_P12_PASS: ${{ secrets.TSCORE_P12_PASSWORD }}
        run: |
          set -euxo pipefail
          # iOS AMFI rejects ad-hoc signatures on standalone dylibs loaded from
          # the app data container: the dylib must be signed with the SAME
          # certificate as the LiveContainer host app. Configure the secrets
          # TSCORE_P12_B64 (base64 of the .p12) and TSCORE_P12_PASSWORD to
          # enable this final signing; otherwise the ad-hoc signature from the
          # previous step is kept.
          echo "$SIGN_P12_B64" | base64 -d > /tmp/sign.p12
          KEYCHAIN=/tmp/tscore.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/sign.p12 -k "$KEYCHAIN" -P "$SIGN_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')"
          codesign --force --sign "$IDENTITY" --timestamp=none dist/libTailscaleCore.dylib
          echo "--- p12-signed verification ---"
          codesign -dv --verbose=2 dist/libTailscaleCore.dylib 2>&1 || true

      - name: Verify Mach-O format
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          file dist/libTailscaleCore.dylib
          lipo -info dist/libTailscaleCore.dylib || true
          echo "--- otool -L ---"
          otool -L dist/libTailscaleCore.dylib

      - name: Verify exported symbols
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          cat > /tmp/expected.txt <<'EOF'
          TsClearExitNode
          TsDebugDERPRegion
          TsDeleteWaitingFile
          TsFileTargets
          TsFreeString
          TsGetDerpOnly
          TsGetExitNodeStatus
          TsGetHttpProxy
          TsGetPrefsJSON
          TsGetWaitingFile
          TsInit
          TsIsRunning
          TsListExitNodes
          TsListPeers
          TsLogin
          TsLoginURL
          TsNeedsLogin
          TsNetcheck
          TsPing
          TsPushFile
          TsSetDerpOnly
          TsSetExitNode
          TsSetExitNodeAllowLANAccess
          TsSetHostname
          TsSetHttpProxy
          TsSetLogCallback
          TsSetPrefsJSON
          TsSetRouteAll
          TsSetStateCallback
          TsSocks5Addr
          TsSocks5Cred
          TsStart
          TsStartLocalHTTPProxy
          TsStatusDetailJSON
          TsStop
          TsStopLocalHTTPProxy
          TsSuggestExitNode
          TsTailscaleIPs
          TsVersion
          TsWaitingFiles
          TsWhoIs
          TsCurrentUser
          EOF
          sort /tmp/expected.txt -o /tmp/expected.txt
          nm -gU dist/libTailscaleCore.dylib \
            | awk '{print $NF}' \
            | sed 's/^_//' \
            | grep -E '^Ts[A-Z]' \
            | sort -u > /tmp/actual.txt
          echo "--- missing symbols (must be empty) ---"
          comm -23 /tmp/expected.txt /tmp/actual.txt
          echo "--- extra Ts* symbols ---"
          comm -13 /tmp/expected.txt /tmp/actual.txt
          MISSING="$(comm -23 /tmp/expected.txt /tmp/actual.txt)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing exported symbols: $MISSING"
            exit 1
          fi
          echo "::notice::All $(wc -l < /tmp/expected.txt) expected Ts* symbols exported."

      - name: Check no undefined symbols
        if: env.SKIP_BUILD != '1'
        run: |
          set -euxo pipefail
          UNDEF="$(nm -u dist/libTailscaleCore.dylib)"
          echo "Undefined symbols (allowed: dyld stubs only):"
          echo "$UNDEF"

      - name: Upload artifact
        if: env.SKIP_BUILD != '1'
        uses: actions/upload-artifact@v4
        with:
          name: libTailscaleCore-ios
          path: |
            dist/libTailscaleCore.dylib
            dist/libTailscaleCore.h
          if-no-files-found: error

      - name: Create GitHub Release
        if: env.SKIP_BUILD != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            TAG="manual-$(date +%Y%m%d-%H%M%S)"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          NOTES="Automated build of the Tailscale core dylib for iOS sideloading."
          NOTES="${NOTES}
          - libTailscaleCore.dylib: arm64 Mach-O dylib (Go c-archive -> clang dynamiclib), iOS 15+
          - libTailscaleCore.h: generated C header (all Ts* exports)

          See cmd/tscore/README.md for integration details."
          gh release create "$TAG" \
            dist/libTailscaleCore.dylib dist/libTailscaleCore.h \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tailscale Core dylib $TAG" \
            --notes "$NOTES"
