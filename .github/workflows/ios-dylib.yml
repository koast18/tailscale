# Builds and publishes the iOS Tailscale core dylib for sideloading.
#
# Mechanism: -buildmode=c-shared on ios/arm64, enabled by a 2-line Go
# toolchain patch (cmd/tscore/patches/toolchain/ios-cshared.patch). c-shared
# emits the load-time initializer (__TEXT,__init_offsets), so dyld starts the
# Go runtime at dlopen and every exported Ts* function is callable. This is
# verified on the iOS simulator by .github/workflows/ios-dylib-cshared.yml.
#
# Deliverables (uploaded + released):
#   libTailscaleCore.dylib        - C ABI dylib (ctor starts runtime at dlopen)
#   libTailscaleCore-lazy.dylib   - same, initializer stripped; host calls
#                                   TsEnsureInit() after dlopen
#   TsCoreVerify.ipa              - host app that dlopens the dylib and runs
#                                   the exported-call verification on-device
#                                   (cmd/tscore/hostapp)
#   libTailscaleCore.h            - generated C header (all Ts* exports)
#
# Triggers: workflow_dispatch; push of a v* tag.
name: iOS Tailscale Core dylib

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios-dylib:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Apply in-repo patches
        run: |
          set -euxo pipefail
          for p in cmd/tscore/patches/*.patch; do git apply "$p"; done

      - name: Build patched Go toolchain (ios c-shared support)
        run: |
          set -euxo pipefail
          GOTOOLCHAIN_VER="$(grep '^go ' go.mod | awk '{print $2}')"
          curl -fsSL "https://go.dev/dl/go${GOTOOLCHAIN_VER}.src.tar.gz" -o /tmp/go.src.tar.gz
          tar -C /tmp -xzf /tmp/go.src.tar.gz
          cd /tmp/go
          git init -q
          git apply "$GITHUB_WORKSPACE/cmd/tscore/patches/toolchain/ios-cshared.patch"
          cd /tmp/go/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash
          /tmp/go/bin/go version

      - name: Build device dylibs (c-shared)
        run: |
          set -euxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0"
          mkdir -p dist
          VERSION="$(tr -d '[:space:]' < VERSION.txt 2>/dev/null || echo dev)"
          HASH="$(git rev-parse --short HEAD)"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-shared -trimpath \
            -ldflags "-s -w -X main.coreVersion=${VERSION}-g${HASH}" \
            -o dist/libTailscaleCore.dylib ./cmd/tscore
          # lazy variant: strip the initializer section; host calls TsEnsureInit()
          cp dist/libTailscaleCore.dylib dist/libTailscaleCore-lazy.dylib
          python3 cmd/tscore/tools/stripinits.py dist/libTailscaleCore-lazy.dylib
          codesign -s - --force dist/libTailscaleCore.dylib
          codesign -s - --force dist/libTailscaleCore-lazy.dylib
          file dist/libTailscaleCore.dylib
          echo "--- init sections ---"
          otool -l dist/libTailscaleCore.dylib | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(none)"
          echo "--- lazy init sections (must be gone) ---"
          otool -l dist/libTailscaleCore-lazy.dylib | grep -E "__init_offsets|__mod_init_func" || echo "(none: OK)"

      - name: Verify exported symbols
        run: |
          set -euxo pipefail
          sort cmd/tscore/expected-symbols.txt -o /tmp/expected.txt
          nm -gU dist/libTailscaleCore.dylib | awk '{print $NF}' | sed 's/^_//' \
            | grep -E '^Ts[A-Z]' | sort -u > /tmp/actual.txt
          echo "--- missing symbols (must be empty) ---"
          comm -23 /tmp/expected.txt /tmp/actual.txt
          MISSING="$(comm -23 /tmp/expected.txt /tmp/actual.txt)"
          if [ -n "$MISSING" ]; then echo "::error::Missing: $MISSING"; exit 1; fi
          echo "::notice::All $(wc -l < /tmp/expected.txt) expected Ts* symbols exported."

      - name: Build TsCoreVerify host app (IPA)
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          APP="dist/TsCoreVerify.app"
          rm -rf "$APP"; mkdir -p "$APP"
          clang -arch arm64 -isysroot "${SDK}" -mios-version-min=15.0 -fobjc-arc \
            cmd/tscore/hostapp/main.m \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o "$APP/TsCoreVerify"
          cp cmd/tscore/hostapp/Info.plist "$APP/"
          # lazy variant embedded: the app calls TsEnsureInit() after dlopen
          cp dist/libTailscaleCore-lazy.dylib "$APP/libTailscaleCore-lazy.dylib"
          codesign -s - --force "$APP/TsCoreVerify"
          codesign -s - --force "$APP/libTailscaleCore-lazy.dylib"
          cd dist && zip -qry TsCoreVerify.ipa TsCoreVerify.app && cd ..
          file dist/TsCoreVerify.ipa

      - name: Final p12 signing (optional)
        if: env.SIGN_P12_B64 != ''
        env:
          SIGN_P12_B64: ${{ secrets.TSCORE_P12_B64 }}
          SIGN_P12_PASS: ${{ secrets.TSCORE_P12_PASSWORD }}
        run: |
          set -euxo pipefail
          echo "$SIGN_P12_B64" | base64 -d > /tmp/sign.p12
          KEYCHAIN=/tmp/tscore.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/sign.p12 -k "$KEYCHAIN" -P "$SIGN_P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')"
          codesign --force --sign "$IDENTITY" --timestamp=none dist/libTailscaleCore.dylib
          codesign --force --sign "$IDENTITY" --timestamp=none dist/libTailscaleCore-lazy.dylib
          codesign --force --sign "$IDENTITY" --timestamp=none dist/TsCoreVerify.app

      - name: Generate header for C ABI dylib
        run: |
          set -euxo pipefail
          # c-shared emits a header next to the dylib (dist/libTailscaleCore.h
          # would be written by go build; re-derive it here).
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -o /tmp/header-probe ./cmd/tscore 2>/dev/null || true
          ls /tmp/header-probe.h 2>/dev/null && cp /tmp/header-probe.h dist/libTailscaleCore.h || echo "using generated header from build"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libTailscaleCore-ios
          path: |
            dist/libTailscaleCore.dylib
            dist/libTailscaleCore-lazy.dylib
            dist/TsCoreVerify.ipa
            dist/libTailscaleCore.h
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi
          NOTES="Tailscale core dylib for iOS sideloading (c-shared mechanism, verified on the iOS simulator).
          - libTailscaleCore.dylib: C ABI, ctor starts the Go runtime at dlopen
          - libTailscaleCore-lazy.dylib: initializer stripped; host calls TsEnsureInit()
          - TsCoreVerify.ipa: on-device verification app (dlopen + exported calls)
          - libTailscaleCore.h: C header

          See cmd/tscore/README.md + LIVECONTAINER.md."
          gh release create "$TAG" \
            dist/libTailscaleCore.dylib dist/libTailscaleCore-lazy.dylib dist/TsCoreVerify.ipa dist/libTailscaleCore.h \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tailscale Core dylib $TAG" \
            --notes "$NOTES"
