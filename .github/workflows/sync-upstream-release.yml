# Polls the upstream tailscale/tailscale repo for new releases and, when a
# new (non-pre) version appears, directly calls the ios-dylib workflow to
# build libTailscaleCore.dylib and publish a GitHub Release named after the
# upstream version.
#
# GitHub cannot receive cross-repo release events, so this runs on a cron.
# It is idempotent: a version whose Release already exists on this fork is
# skipped, and the build workflow itself skips re-creating an existing
# Release.
name: Sync upstream Tailscale releases

on:
  schedule:
    # every 6 hours, at minute 17
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.check.outputs.upstream }}
    steps:
      - name: Check upstream latest non-pre release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          # releases/latest excludes pre-releases by default.
          UPSTREAM="$(gh api repos/tailscale/tailscale/releases/latest --jq .tag_name)"
          echo "::notice::Upstream latest release tag: $UPSTREAM"
          [ -n "$UPSTREAM" ] || { echo "no upstream release found; done."; exit 0; }

          # Already built and released on this fork?
          if gh release view "$UPSTREAM" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $UPSTREAM already exists on this fork; skipping."
            exit 0
          fi

          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.upstream != ''
    uses: ./.github/workflows/ios-dylib.yml
    with:
      release_tag: ${{ needs.check.outputs.upstream }}
