# iOS dylib via -buildmode=c-shared (patched Go toolchain).
#
# Go 1.26.6's c-archive for ios/arm64 no longer emits the _rt0_arm64_ios_lib
# load-time initializer (DCE removes it), so a c-archive -> clang-dylib has
# no constructor and cannot start the Go runtime. -buildmode=c-shared is the
# supported dynamic-library path on darwin and keeps the ctor + the cgo
# runtime hooks; ios/arm64 is only excluded from it by a 2-line check in
# internal/platform (cmd/tscore/patches/toolchain/ios-cshared.patch).
#
# This workflow builds a patched Go toolchain, produces BOTH variants for the
# iOS simulator and the device:
#   plain - ctor intact (dyld starts the Go runtime at dlopen)
#   lazy  - initializer stripped (cmd/tscore/tools/stripinits.py); the host
#           calls TsEnsureInit() right after dlopen
# and runs the dlopen + exported-call test on a booted iPhone simulator.
name: iOS dylib c-shared experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cshared:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Apply in-repo patches
        run: |
          set -euxo pipefail
          for p in cmd/tscore/patches/*.patch; do git apply "$p"; done

      - name: Build patched Go toolchain (ios c-shared support)
        run: |
          set -euxo pipefail
          GOTOOLCHAIN_VER="$(grep '^go ' go.mod | awk '{print $2}')"
          echo "Patching Go $GOTOOLCHAIN_VER"
          curl -fsSL "https://go.dev/dl/go${GOTOOLCHAIN_VER}.src.tar.gz" -o /tmp/go.src.tar.gz
          tar -C /tmp -xzf /tmp/go.src.tar.gz
          cd /tmp/go
          git init -q
          git apply "$GITHUB_WORKSPACE/cmd/tscore/patches/toolchain/ios-cshared.patch"
          echo "=== patch applied ==="
          cd /tmp/go/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash
          /tmp/go/bin/go version

      - name: Build simulator c-shared dylibs
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0"
          mkdir -p /tmp/probe/nocgo /tmp/probe/cgo
          cat > /tmp/probe/nocgo/go.mod <<'EOF'
          module nocgo
          
          go 1.26.6
          EOF
          cat > /tmp/probe/nocgo/main.go <<'EOF'
          package main
          
          func main() {}
          EOF
          cat > /tmp/probe/cgo/go.mod <<'EOF'
          module cgo
          
          go 1.26.6
          EOF
          cat > /tmp/probe/cgo/main.go <<'EOF'
          package main
          
          import "C"
          
          //export Probe
          func Probe() *C.char { return C.CString("x") }
          
          func main() {}
          EOF
          echo "=== A) c-shared, NO cgo: link? ctor? ==="
          (cd /tmp/probe/nocgo && CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build -buildmode=c-shared -o /tmp/probe/nocgo.dylib .) && echo "A LINK OK" || echo "A LINK FAILED"
          otool -l /tmp/probe/nocgo.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(A: no init sections)"
          nm -gU /tmp/probe/nocgo.dylib 2>/dev/null | grep "_rt0_arm64" | head -3 || echo "(A: no rt0 syms)"
          echo "=== B) c-shared, WITH cgo export: link? ctor? ==="
          (cd /tmp/probe/cgo && CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" go build -buildmode=c-shared -o /tmp/probe/cgo.dylib .) && echo "B LINK OK" || echo "B LINK FAILED"
          otool -l /tmp/probe/cgo.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(B: no init sections)"
          nm -gU /tmp/probe/cgo.dylib 2>/dev/null | grep "_rt0_arm64" | head -3 || echo "(B: no rt0 syms)"
          echo "=== C) c-shared, current tscore (wait-only preamble): link? ctor? ==="
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o dist/TsCore-cshared-sim.dylib ./cmd/tscore && echo "C LINK OK" || echo "C LINK FAILED"
          echo "--- C dylib init sections ---"
          otool -l dist/TsCore-cshared-sim.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(C: no init sections)"
          echo "--- C dylib Ts*/cgo exports ---"
          nm -gU dist/TsCore-cshared-sim.dylib 2>/dev/null | grep -E "TsVersion|TsInit$|TsEnsureInit|cgo_wait|Probe" | head -8
          codesign -s - --force dist/TsCore-cshared-sim.dylib
          cp dist/TsCore-cshared-sim.dylib dist/TsCore-cshared-sim-lazy.dylib
          python3 "$GITHUB_WORKSPACE/cmd/tscore/tools/stripinits.py" dist/TsCore-cshared-sim-lazy.dylib 2>/dev/null || echo "(stripinits: no init sections?)"
          codesign -s - --force dist/TsCore-cshared-sim-lazy.dylib
          echo "--- C lazy init sections (should be gone) ---"
          otool -l dist/TsCore-cshared-sim-lazy.dylib 2>/dev/null | grep -E "__init_offsets|__mod_init_func" || echo "(C lazy: no init sections - OK)"
          echo "=== D) c-archive + clang dylib, current tscore: rt0 defined in archive? ==="
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-archive -trimpath -ldflags "-s -w" -o /tmp/probe/tscore.a ./cmd/tscore
          echo "rt0 defined count: $(nm -g /tmp/probe/tscore.a 2>/dev/null | grep -c 'T __rt0_arm64_ios_lib')"
          clang -dynamiclib -arch arm64 -isysroot "${SDK}" -mios-simulator-version-min=15.0 -Wl,-all_load -Wl,-ObjC /tmp/probe/tscore.a -framework Foundation -framework Security -framework CoreFoundation -o /tmp/probe/tscore-d.dylib && echo "D LINK OK" || echo "D LINK FAILED"
          otool -l /tmp/probe/tscore-d.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(D: no init sections)"
          echo "=== E) c-shared tscore WITHOUT my preamble (git worktree at pre-change commit) ==="
          cd "$GITHUB_WORKSPACE"
          git worktree add -q /tmp/probe/wt 34353bce5 2>/dev/null || git worktree add -q /tmp/probe/wt HEAD
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o /tmp/probe/tscore-old.dylib ./cmd/tscore && echo "E LINK OK" || echo "E LINK FAILED"
          otool -l /tmp/probe/tscore-old.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(E: no init sections)"
          nm -gU /tmp/probe/tscore-old.dylib 2>/dev/null | grep -E "_rt0_arm64|cgo_wait" | head -5 || echo "(E: no rt0/cgo syms)"
          git worktree remove --force /tmp/probe/wt 2>/dev/null || true

      - name: Build device c-shared dylibs
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" \
            -o dist/TsCore-cshared-device.dylib ./cmd/tscore
          cp dist/TsCore-cshared-device.dylib dist/TsCore-cshared-device-lazy.dylib
          python3 cmd/tscore/tools/stripinits.py dist/TsCore-cshared-device-lazy.dylib 2>/dev/null || true
          codesign -s - --force dist/TsCore-cshared-device.dylib
          codesign -s - --force dist/TsCore-cshared-device-lazy.dylib
          file dist/TsCore-cshared-device.dylib dist/TsCore-cshared-device-lazy.dylib
          echo "--- device init sections ---"
          otool -l dist/TsCore-cshared-device.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(none)"
          echo "--- device Ts* count ---"
          nm -gU dist/TsCore-cshared-device.dylib 2>/dev/null | awk '{print $NF}' | sed 's/^_//' | grep -c '^Ts' || true

      - name: Build simulator host test
        continue-on-error: true
        run: |
          set -euxo pipefail
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          clang -arch arm64 -isysroot "${SDK}" -mios-simulator-version-min=15.0 \
            -o dist/dlopen_test_sim cmd/tscore/tools/dlopen_test.c
          codesign -s - --force dist/dlopen_test_sim

      - name: Boot iOS simulator
        run: |
          set -euxo pipefail
          UDID="$(python3 - <<'EOF'
          import json, subprocess
          out = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devs = [d for ds in out.get("devices", {}).values() for d in ds if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
          print(devs[0]["udid"] if devs else "")
          EOF
          )"
          if [ -z "$UDID" ]; then
            echo "no available iPhone device; creating one"
            RUNTIME_ID="$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["runtimes"][0]["identifier"] if d["runtimes"] else "")')"
            DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); t=[x for x in d["devicetypes"] if "iPhone" in x["name"]]; print(t[0]["identifier"] if t else "")')"
            UDID="$(xcrun simctl create tscore-verify "$DEVICE_TYPE" "$RUNTIME_ID")"
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "simulator booted: $UDID"

      - name: Run simulator dlopen tests
        run: |
          set -uxo pipefail
          DYLIB=""
          for cand in dist/TsCore-cshared-sim.dylib /tmp/probe/tscore-old.dylib /tmp/probe/tscore-cur.dylib; do
            if [ -f "$cand" ]; then DYLIB="$cand"; break; fi
          done
          if [ -z "$DYLIB" ] || [ ! -f dist/dlopen_test_sim ]; then
            echo "no c-shared dylib or host test found; skipping sim run"
            exit 0
          fi
          echo "using dylib: $DYLIB"
          SIMDATA="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data"
          mkdir -p "$SIMDATA/tmp" "$SIMDATA/tmp/Documents"
          echo "===== simulator filesystem probe ====="
          xcrun simctl spawn "$UDID" /bin/sh -c 'echo PWD=$(pwd); echo "-- /tmp --"; ls -ld /tmp 2>&1; echo "-- /var/tmp --"; ls -ld /var/tmp 2>&1; echo "-- /private/var/tmp --"; ls -ld /private/var/tmp 2>&1; echo "-- df --"; df -h / 2>&1 | head -4; echo PROBE-OK' || echo "(probe failed)"
          # Copy into every candidate tmp location.
          for d in "$SIMDATA/tmp" "$SIMDATA/var/tmp" "$SIMDATA/private/var/tmp"; do
            mkdir -p "$d" && cp "$DYLIB" "$d/TsCore-test.dylib" && cp dist/dlopen_test_sim "$d/" && echo "copied to $d"
          done
          run_watchdog() {
            local secs="$1"; shift
            local out="$1"; shift
            "$@" >"$out" 2>&1 &
            local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) &
            local killer=$!
            wait "$pid"
            local rc=$?
            kill "$killer" 2>/dev/null || true
            cat "$out"
            return $rc
          }
          echo "===== c-shared PLAIN variant (ctor under dlopen) ====="
          for TMP in /tmp /var/tmp; do
            TAG="$(echo "$TMP" | tr '/' '_')"
            echo "--- plain via $TMP ---"
            run_watchdog 180 "sim-plain$TAG.log" env SIMCTL_CHILD_LC_HOME_PATH="$TMP" xcrun simctl spawn "$UDID" /bin/sh -c "$TMP/dlopen_test_sim $TMP/TsCore-test.dylib" && { echo "PLAIN PASS on $TMP"; break; } || echo "RC=$? (non-zero)"
          done
          echo "===== c-shared LAZY variant (strip ctor + TsEnsureInit) ====="
          if python3 cmd/tscore/tools/stripinits.py "$DYLIB" 2>/dev/null; then
            for d in "$SIMDATA/tmp" "$SIMDATA/var/tmp"; do cp "$DYLIB" "$d/TsCore-test-lazy.dylib"; done
            for TMP in /tmp /var/tmp; do
              TAG="$(echo "$TMP" | tr '/' '_')"
              echo "--- lazy via $TMP ---"
              run_watchdog 180 "sim-lazy$TAG.log" env SIMCTL_CHILD_LC_HOME_PATH="$TMP" xcrun simctl spawn "$UDID" /bin/sh -c "$TMP/dlopen_test_sim $TMP/TsCore-test-lazy.dylib --lazy" && { echo "LAZY PASS on $TMP"; break; } || echo "RC=$? (non-zero)"
            done
          else
            echo "stripinits failed; lazy variant skipped"
          fi
          echo "===== boot traces inside simulator ====="
          cat "$SIMDATA/tmp/tscore-boot.log" 2>/dev/null || true
          cat "$SIMDATA/tmp/Documents/tscore-boot.log" 2>/dev/null || echo "(no boot log found)"
          echo "===== results ====="
          grep -h "TEST-PASS" sim-*.log 2>/dev/null || echo "NO TEST-PASS FOUND"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cshared-dylibs
          path: |
            dist/TsCore-cshared-*
            sim-*.log
          if-no-files-found: ignore
