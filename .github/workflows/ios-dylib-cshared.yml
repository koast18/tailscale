# iOS dylib via -buildmode=c-shared (patched Go toolchain).
#
# Go 1.26.6's c-archive for ios/arm64 no longer emits the _rt0_arm64_ios_lib
# load-time initializer (DCE removes it), so a c-archive -> clang-dylib has
# no constructor and cannot start the Go runtime. -buildmode=c-shared is the
# supported dynamic-library path on darwin and keeps the ctor + the cgo
# runtime hooks; ios/arm64 is only excluded from it by a 2-line check in
# internal/platform (cmd/tscore/patches/toolchain/ios-cshared.patch).
#
# This workflow builds a patched Go toolchain, produces BOTH variants for the
# iOS simulator and the device:
#   plain - ctor intact (dyld starts the Go runtime at dlopen)
#   lazy  - initializer stripped (cmd/tscore/tools/stripinits.py); the host
#           calls TsEnsureInit() right after dlopen
# and runs the dlopen + exported-call test on a booted iPhone simulator.
name: iOS dylib c-shared experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cshared:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Apply in-repo patches
        run: |
          set -euxo pipefail
          for p in cmd/tscore/patches/*.patch; do git apply "$p"; done

      - name: Build patched Go toolchain (ios c-shared support)
        run: |
          set -euxo pipefail
          GOTOOLCHAIN_VER="$(grep '^go ' go.mod | awk '{print $2}')"
          echo "Patching Go $GOTOOLCHAIN_VER"
          curl -fsSL "https://go.dev/dl/go${GOTOOLCHAIN_VER}.src.tar.gz" -o /tmp/go.src.tar.gz
          tar -C /tmp -xzf /tmp/go.src.tar.gz
          cd /tmp/go
          git init -q
          git apply "$GITHUB_WORKSPACE/cmd/tscore/patches/toolchain/ios-cshared.patch"
          echo "=== patch applied ==="
          cd /tmp/go/src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash
          /tmp/go/bin/go version

      - name: Build simulator c-shared dylibs
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0"
          mkdir -p /tmp/probe/nocgo /tmp/probe/cgo
          cat > /tmp/probe/nocgo/go.mod <<'EOF'
          module nocgo

          go 1.26.6
          EOF
          cat > /tmp/probe/nocgo/main.go <<'EOF'
          package main

          func main() {}
          EOF
          cat > /tmp/probe/cgo/go.mod <<'EOF'
          module cgo

          go 1.26.6
          EOF
          cat > /tmp/probe/cgo/main.go <<'EOF'
          package main

          import "C"

          //export Probe
          func Probe() *C.char { return C.CString("x") }

          func main() {}
          EOF
          echo "=== A) c-shared, NO cgo: link? ctor? ==="
          (cd /tmp/probe/nocgo && CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build -buildmode=c-shared -o /tmp/probe/nocgo.dylib .) && echo "A LINK OK" || echo "A LINK FAILED"
          otool -l /tmp/probe/nocgo.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(A: no init sections)"
          nm -gU /tmp/probe/nocgo.dylib 2>/dev/null | grep "_rt0_arm64" | head -3 || echo "(A: no rt0 syms)"
          echo "=== B) c-shared, WITH cgo export: link? ctor? ==="
          (cd /tmp/probe/cgo && CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" go build -buildmode=c-shared -o /tmp/probe/cgo.dylib .) && echo "B LINK OK" || echo "B LINK FAILED"
          otool -l /tmp/probe/cgo.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(B: no init sections)"
          nm -gU /tmp/probe/cgo.dylib 2>/dev/null | grep "_rt0_arm64" | head -3 || echo "(B: no rt0 syms)"
          echo "=== C) c-shared, current tscore (wait-only preamble): link? ctor? ==="
          cd "$GITHUB_WORKSPACE"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o dist/TsCore-cshared-sim.dylib ./cmd/tscore && echo "C LINK OK" || echo "C LINK FAILED"
          echo "--- C dylib init sections ---"
          otool -l dist/TsCore-cshared-sim.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(C: no init sections)"
          echo "--- C dylib Ts*/cgo exports ---"
          nm -gU dist/TsCore-cshared-sim.dylib 2>/dev/null | grep -E "TsVersion|TsInit$|TsEnsureInit|cgo_wait|Probe" | head -8
          codesign -s - --force dist/TsCore-cshared-sim.dylib
          cp dist/TsCore-cshared-sim.dylib dist/TsCore-cshared-sim-lazy.dylib
          python3 "$GITHUB_WORKSPACE/cmd/tscore/tools/stripinits.py" dist/TsCore-cshared-sim-lazy.dylib 2>/dev/null || echo "(stripinits: no init sections?)"
          codesign -s - --force dist/TsCore-cshared-sim-lazy.dylib
          echo "--- C lazy init sections (should be gone) ---"
          otool -l dist/TsCore-cshared-sim-lazy.dylib 2>/dev/null | grep -E "__init_offsets|__mod_init_func" || echo "(C lazy: no init sections - OK)"
          echo "=== D) c-archive + clang dylib, current tscore: rt0 defined in archive? ==="
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-archive -trimpath -ldflags "-s -w" -o /tmp/probe/tscore.a ./cmd/tscore
          echo "rt0 defined count: $(nm -g /tmp/probe/tscore.a 2>/dev/null | grep -c 'T __rt0_arm64_ios_lib')"
          clang -dynamiclib -arch arm64 -isysroot "${SDK}" -mios-simulator-version-min=15.0 -Wl,-all_load -Wl,-ObjC /tmp/probe/tscore.a -framework Foundation -framework Security -framework CoreFoundation -o /tmp/probe/tscore-d.dylib && echo "D LINK OK" || echo "D LINK FAILED"
          otool -l /tmp/probe/tscore-d.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(D: no init sections)"
          echo "=== E) c-shared tscore WITHOUT my preamble (git worktree at pre-change commit) ==="
          cd "$GITHUB_WORKSPACE"
          git worktree add -q /tmp/probe/wt 34353bce5 2>/dev/null || git worktree add -q /tmp/probe/wt HEAD
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-simulator-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" -o /tmp/probe/tscore-old.dylib ./cmd/tscore && echo "E LINK OK" || echo "E LINK FAILED"
          otool -l /tmp/probe/tscore-old.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(E: no init sections)"
          nm -gU /tmp/probe/tscore-old.dylib 2>/dev/null | grep -E "_rt0_arm64|cgo_wait" | head -5 || echo "(E: no rt0/cgo syms)"
          git worktree remove --force /tmp/probe/wt 2>/dev/null || true

      - name: Build device c-shared dylibs
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mios-version-min=15.0"
          mkdir -p dist
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mios-version-min=15.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" \
            -o dist/TsCore-cshared-device.dylib ./cmd/tscore
          cp dist/TsCore-cshared-device.dylib dist/TsCore-cshared-device-lazy.dylib
          python3 cmd/tscore/tools/stripinits.py dist/TsCore-cshared-device-lazy.dylib 2>/dev/null || true
          codesign -s - --force dist/TsCore-cshared-device.dylib
          codesign -s - --force dist/TsCore-cshared-device-lazy.dylib
          file dist/TsCore-cshared-device.dylib dist/TsCore-cshared-device-lazy.dylib
          echo "--- device init sections ---"
          otool -l dist/TsCore-cshared-device.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(none)"
          echo "--- device Ts* count ---"
          nm -gU dist/TsCore-cshared-device.dylib 2>/dev/null | awk '{print $NF}' | sed 's/^_//' | grep -c '^Ts' || true

      - name: Device dylib dlopen-readiness validation
        run: |
          set -uxo pipefail
          D="dist/TsCore-cshared-device.dylib"
          if [ ! -f "$D" ]; then echo "no device dylib; skipping"; exit 0; fi
          echo "=== LC_LOAD_DYLIB dependencies (must all be system frameworks/lib) ==="
          otool -L "$D" | sed -n '2,20p'
          echo "=== undefined symbols (may only reference system dyld cache) ==="
          nm -u "$D" | head -10 || echo "(none)"
          echo "=== undefined count ==="
          nm -u "$D" | wc -l
          echo "=== code signature ==="
          codesign -dv --verbose=2 "$D" 2>&1 | head -6 || true
          echo "=== build version / min OS ==="
          vtool -show-build "$D" 2>/dev/null || otool -l "$D" | grep -A4 LC_BUILD_VERSION | head -8
          echo "=== initializer entry (plain) must be non-empty ==="
          python3 - <<'EOF'
          import struct
          for path in ("dist/TsCore-cshared-device.dylib", "dist/TsCore-cshared-device-lazy.dylib"):
              data = open(path, "rb").read()
              ncmds = struct.unpack("<I", data[16:20])[0]
              off = 32
              inits = []
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack("<II", data[off:off+8])
                  if cmd == 0x19:
                      nsects = struct.unpack("<I", data[off+64:off+68])[0]
                      so = off + 72
                      for _ in range(nsects):
                          sname = data[so:so+16].split(b"\x00")[0].decode()
                          if sname in ("__init_offsets", "__mod_init_func"):
                              size = struct.unpack("<Q", data[so+40:so+48])[0]
                              inits.append((sname, size))
                          so += 80
                  off += cmdsize
              print(f"{path.split('/')[-1]}: init_sections={inits}")
              assert any(size > 0 for _, size in inits) == ("lazy" not in path), \
                  "plain must have a live initializer, lazy must not"
          print("ctor validation OK")
          EOF

      - name: macOS native control (darwin c-shared + dlopen test)
        continue-on-error: true
        run: |
          set -uxo pipefail
          export PATH="/tmp/go/bin:$PATH"
          export GOTOOLCHAIN=local
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          CC="$(xcrun --find clang) -arch arm64 -isysroot ${SDK} -mmacosx-version-min=13.0"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
          CC="${CC}" \
          CGO_CFLAGS="-arch arm64 -isysroot ${SDK} -mmacosx-version-min=13.0" \
          CGO_LDFLAGS="-arch arm64 -isysroot ${SDK} -mmacosx-version-min=13.0" \
          go build -buildmode=c-shared -trimpath -ldflags "-s -w" \
            -o dist/TsCore-mac.dylib ./cmd/tscore && echo "MAC BUILD OK" || echo "MAC BUILD FAILED"
          otool -l dist/TsCore-mac.dylib 2>/dev/null | grep -A2 -E "__init_offsets|__mod_init_func" || echo "(mac: no init sections)"
          nm -gU dist/TsCore-mac.dylib 2>/dev/null | grep -E "TsVersion|TsInit$|TsEnsureInit|cgo_wait" | head -6
          clang -arch arm64 -isysroot "${SDK}" -mmacosx-version-min=13.0 \
            -o dist/dlopen_test_mac cmd/tscore/tools/dlopen_test.c
          echo "--- native dlopen test (plain) ---"
          run_watchdog() {
            local secs="$1"; shift; local out="$1"; shift
            "$@" >"$out" 2>&1 & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null ) & local killer=$!
            wait "$pid" 2>/dev/null || true
            kill "$killer" 2>/dev/null || true
            cat "$out"
          }
          run_watchdog 60 mac-plain.log ./dist/dlopen_test_mac ./dist/TsCore-mac.dylib
          echo "--- native dlopen test (lazy: TsEnsureInit) ---"
          cp dist/TsCore-mac.dylib dist/TsCore-mac-lazy.dylib
          python3 cmd/tscore/tools/stripinits.py dist/TsCore-mac-lazy.dylib 2>/dev/null || true
          run_watchdog 60 mac-lazy.log ./dist/dlopen_test_mac ./dist/TsCore-mac-lazy.dylib --lazy

      - name: Boot iOS simulator (prefer iOS 18.6 runtime)
        run: |
          set -euxo pipefail
          # Prefer the iOS 18.6 runtime (the simulator form of the 18.6.x
          # device OS line; 18.6.2 ships no separate sim runtime). Fall back
          # to the newest iOS runtime if 18.6 is absent.
          RUNTIME_NAME="$(xcrun simctl list runtimes -j | python3 - <<'EOF'
          import json, subprocess, sys
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))
          rt = [r for r in d.get("runtimes", []) if r.get("name", "").startswith("iOS 18.6")]
          if not rt:
              rt = [r for r in d.get("runtimes", []) if r.get("name", "").startswith("iOS")]
          print(rt[0]["identifier"] if rt else "")
          EOF
          )"
          echo "selected runtime: $RUNTIME_NAME"
          if [ -z "$RUNTIME_NAME" ]; then
            echo "::error::no iOS runtime available"; exit 1
          fi
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, subprocess, sys
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "-j"]))
          # prefer older iPhone types that support the iOS 18.6 runtime
          want = ["iPhone-16-Pro", "iPhone-16", "iPhone-15-Pro", "iPhone-15", "iPhone-14-Pro", "iPhone-14"]
          ids = {x["identifier"] for x in d["devicetypes"]}
          pick = next((w for w in want if w in ids), None)
          print(pick or "")
          ')"
          UDID=""
          for dt in "$DEVICE_TYPE" com.apple.CoreSimulator.SimDeviceType.iPhone-16 com.apple.CoreSimulator.SimDeviceType.iPhone-15; do
            echo "trying device type: $dt"
            if UDID="$(xcrun simctl create tscore-verify "$dt" "$RUNTIME_NAME" 2>/dev/null)"; then
              echo "created with $dt"; break
            fi
            UDID=""
          done
          if [ -z "$UDID" ]; then echo "::error::could not create device on $RUNTIME_NAME"; exit 1; fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "runtime=$RUNTIME_NAME" >> "$GITHUB_ENV"
          echo "created simulator $UDID on $RUNTIME_NAME"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list runtimes | grep -i "$RUNTIME_NAME" || true
          echo "simulator booted: $UDID"

      - name: Run simulator dlopen tests (host app via simctl launch)
        run: |
          set -uxo pipefail
          DYLIB="dist/TsCore-cshared-sim.dylib"
          if [ ! -f "$DYLIB" ]; then echo "no c-shared sim dylib; skipping"; exit 0; fi
          echo "using dylib: $DYLIB"
          # Assemble a real (minimal) app bundle for the simulator: the host
          # app dlopens libTailscaleCore-lazy.dylib from its own bundle and
          # prints every step (see cmd/tscore/hostapp/main.m). simctl handles
          # installing the bundle into the simulator filesystem.
          APP="dist/TsCoreVerify.app"
          rm -rf "$APP"
          mkdir -p "$APP"
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          clang -arch arm64 -isysroot "${SDK}" -mios-simulator-version-min=15.0 -fobjc-arc \
            cmd/tscore/hostapp/main.m \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -o "$APP/TsCoreVerify"
          codesign -s - --force "$APP/TsCoreVerify"
          cp cmd/tscore/hostapp/Info.plist "$APP/"
          cp "$DYLIB" "$APP/libTailscaleCore-lazy.dylib"
          file "$APP/TsCoreVerify" "$APP/libTailscaleCore-lazy.dylib"
          xcrun simctl install "$UDID" "$APP" || { echo "simctl install failed"; exit 1; }
          echo "installed; launching with console..."
          # launch --console streams stdout/stderr; the app stays running after
          # the test, so capture for a while then stop.
          xcrun simctl launch --console "$UDID" dev.koast18.tscoreverify > sim-console.log 2>&1 &
          LPID=$!
          ( sleep 90; kill -9 "$LPID" 2>/dev/null ) &
          KPID=$!
          wait "$LPID" 2>/dev/null || true
          kill "$KPID" 2>/dev/null || true
          sleep 2
          echo "=== simulator console output ==="
          cat sim-console.log || true
          echo "===== results ====="
          grep -E "VERIFY-PASS|FAIL |TsVersion|TsInit|TsIsRunning|dlopen|TsEnsureInit" sim-console.log | head -20 || echo "(no result lines)"
          echo "===== results ====="
          grep -h "TEST-PASS" sim-*.log 2>/dev/null || echo "NO TEST-PASS FOUND"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cshared-dylibs
          path: |
            dist/TsCore-cshared-*
            sim-*.log
          if-no-files-found: ignore
